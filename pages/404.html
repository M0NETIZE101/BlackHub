<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - MoviesAndSeriesHub</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
            background: var(--bg-primary);
        }
        .error-content {
            max-width: 500px;
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: 24px;
            color: var(--primary);
        }
        .error-code {
            color: var(--primary);
            font-size: 72px;
            font-weight: 900;
            display: block;
            margin-bottom: 8px;
        }
        .error-content h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .error-content p {
            color: var(--text-secondary);
            font-size: 18px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            padding: 12px 32px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }
        .btn-secondary {
            padding: 12px 32px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        .movie-suggestions {
            margin-top: 48px;
        }
        .movie-suggestions h3 {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 16px;
        }
        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }
        .suggestion-item {
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
        }
        .suggestion-item:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow);
        }
        .suggestion-item img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .suggestion-item .title {
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-simple {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            padding: 12px 4%;
            border-bottom: 1px solid var(--border-color);
        }
        .header-simple .logo {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
        }
        .header-simple .logo i {
            color: var(--primary);
        }
        .header-simple .logo span:last-child {
            color: var(--primary);
        }
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            z-index: 100;
            transition: var(--transition);
        }
        .theme-toggle:hover {
            background: var(--primary);
            color: #fff;
        }
    </style>
</head>
<body>
    <header class="header-simple">
        <nav style="max-width:1440px;margin:0 auto;">
            <a href="../index.html" class="logo">
                <i class="fas fa-film"></i>
                <span>Movies<span>AndSeries</span>Hub</span>
            </a>
        </nav>
    </header>

    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="error-container" style="margin-top:68px;">
        <div class="error-content">
            <div class="error-icon"><i class="fas fa-film"></i></div>
            <span class="error-code">404</span>
            <h1>Page Not Found</h1>
            <p>Oops! The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
            <div class="error-actions">
                <a href="../index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="javascript:history.back()" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> Go Back
                </a>
            </div>

            <div class="movie-suggestions">
                <h3>🎥 Popular Movies You Might Like</h3>
                <div class="suggestions-grid" id="suggestionsGrid">
                    <div class="suggestion-item" onclick="window.location.href='../index.html'">
                        <img src="https://image.tmdb.org/t/p/w200/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg" alt="Inception" loading="lazy" onerror="this.style.display='none'">
                        <div class="title">Inception</div>
                    </div>
                    <div class="suggestion-item" onclick="window.location.href='../index.html'">
                        <img src="https://image.tmdb.org/t/p/w200/qJ2tW6WMUDux911r6m7haRef0WH.jpg" alt="Interstellar" loading="lazy" onerror="this.style.display='none'">
                        <div class="title">Interstellar</div>
                    </div>
                    <div class="suggestion-item" onclick="window.location.href='../index.html'">
                        <img src="https://image.tmdb.org/t/p/w200/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg" alt="Avengers" loading="lazy" onerror="this.style.display='none'">
                        <div class="title">Avengers</div>
                    </div>
                    <div class="suggestion-item" onclick="window.location.href='../index.html'">
                        <img src="https://image.tmdb.org/t/p/w200/ikR4wVv88p7OBGZZYOp8N4Ssdak.jpg" alt="The Batman" loading="lazy" onerror="this.style.display='none'">
                        <div class="title">The Batman</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const btn = document.querySelector('.theme-toggle i');
            btn.className = newTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const btn = document.querySelector('.theme-toggle i');
        btn.className = savedTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
    </script>
</body>
</html>
