<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">
    <meta name="description" content="MoviesAndSeriesHub - Stream unlimited movies and TV shows.">
    <title>MoviesAndSeriesHub - Welcome</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e50914'/%3E%3Ctext x='50' y='68' font-size='60' font-family='Arial' text-anchor='middle' fill='white' font-weight='bold'%3EMSH%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="public/manifest.json">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Apply saved theme before render
        (function() {
            var saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body class="landing-body">

    <section class="landing-hero">
        <div class="landing-backdrop" id="landingBackdrop"></div>
        <div class="landing-overlay"></div>

        <div class="landing-content">
            <div class="landing-logo">
                <i class="fas fa-film"></i>
                <span>Movies<span class="accent">AndSeries</span>Hub</span>
            </div>
            <p class="landing-tagline">Unlimited Movies &amp; TV Shows.<br>Anytime, Anywhere.</p>

            <!-- Search -->
            <div class="landing-search-row">
                <div class="landing-search-box" id="landingSearchBox">
                    <button type="button" class="landing-search-icon-btn" id="landingSearchIconBtn" aria-label="Open search">
                        <i class="fas fa-search"></i>
                    </button>
                    <div class="landing-search-input-wrap">
                        <i class="fas fa-search landing-search-inside-icon"></i>
                        <input type="text"
                               class="landing-search-input"
                               id="landingSearchInput"
                               placeholder="Search movies or TV shows..."
                               autocomplete="off">
                    </div>
                    <button type="button" class="landing-search-close-btn" id="landingSearchCloseBtn" aria-label="Close search">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Watch Now -->
            <button class="landing-cta" id="landingEnterBtn">
                <i class="fas fa-play"></i> Watch Now
            </button>
        </div>
    </section>

    <section class="landing-trending">
        <h2><i class="fas fa-fire"></i> Trending This Week</h2>
        <div class="landing-trending-grid" id="landingTrendingGrid"></div>
        <p class="landing-attribution">Data provided by TMDB. © 2026 MoviesAndSeriesHub.</p>
    </section>

    <script src="js/config.js"></script>
    <script src="js/landing.js"></script>
</body>
</html>
